<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="marsDeepSpace" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f0c18"/>
      <stop offset="60%" stop-color="#07060d"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>
    <radialGradient id="marsAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="marsSurface" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="80%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <linearGradient id="marsSolarPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#marsDeepSpace)"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="70" cy="90" r="0.9"/>
    <circle cx="180" cy="50" r="1.3"/>
    <circle cx="260" cy="110" r="0.7"/>
    <circle cx="390" cy="35" r="1.4"/>
    <circle cx="510" cy="70" r="0.8"/>
    <circle cx="680" cy="40" r="1.2"/>
    <circle cx="740" cy="120" r="0.9"/>
    <circle cx="90" cy="430" r="1.1"/>
    <circle cx="680" cy="420" r="0.8"/>
  </g>

  <!-- Distant Martian Moon Phobos -->
  <g transform="translate(680, 160)">
    <polygon points="0,-6 8,-3 10,5 3,11 -6,9 -9,1 -5,-5" fill="#78716c"/>
    <circle cx="-1" cy="2" r="3" fill="#44403c"/>
  </g>

  <!-- Mars Planet Body (Lower Half) -->
  <g transform="translate(400, 540)">
    <!-- Thin Atmospheric Glow Ring -->
    <circle cx="0" cy="0" r="335" fill="url(#marsAtmosphere)"/>
    <!-- Red Planet Disk -->
    <circle cx="0" cy="0" r="315" fill="url(#marsSurface)"/>

    <!-- Dark Volcanic Lowlands (Syrtis Major & Acidalia) -->
    <ellipse cx="-120" cy="-200" rx="95" ry="50" fill="#7c2d12" opacity="0.7" transform="rotate(-15 -120 -200)"/>
    <ellipse cx="140" cy="-210" rx="110" ry="60" fill="#7c2d12" opacity="0.65" transform="rotate(10 140 -210)"/>

    <!-- Valles Marineris Canyon Chasm -->
    <path d="M -80 -140 Q 20 -160 110 -130 Q 150 -120 180 -135" stroke="#451a03" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M -70 -138 Q 25 -158 115 -128" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- North Polar Ice Cap (Bright Frozen Carbon Dioxide & Water Ice) -->
    <path d="M -90 -300 Q 0 -325 90 -300 Q 50 -280 0 -285 Q -50 -280 -90 -300 Z" fill="#f8fafc" opacity="0.95"/>
    <path d="M -60 -296 Q 0 -315 60 -296" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Orbital Trajectory Arc -->
  <path d="M 80,240 Q 400,160 740,260" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Radar Sounding Swath (SHARAD Radar Pulses) -->
  <polygon points="410,185 300,280 520,280" fill="#f97316" opacity="0.08"/>
  <line x1="410" y1="185" x2="340" y2="280" stroke="#f97316" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.5"/>
  <line x1="410" y1="185" x2="480" y2="280" stroke="#f97316" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.5"/>

  <!-- Mars Reconnaissance Orbiter (MRO Class Spacecraft) -->
  <g transform="translate(410, 180) rotate(-6)">
    <!-- Central Octagonal Bus -->
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- Thermal Blanket Stitching -->
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#d97706" stroke-width="0.8"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#d97706" stroke-width="0.8"/>

    <!-- Massive 3-meter High-Gain Antenna Dish (Points toward distant Earth) -->
    <g transform="translate(-18, -12) rotate(-40)">
      <path d="M -18 0 Q 0 -22 18 0" fill="none" stroke="#f8fafc" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="0" cy="-16" r="2" fill="#38bdf8"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#64748b" stroke-width="3"/>
    </g>

    <!-- Large Deep-Space Solar Wings (Required for 43% sunlight at Mars) -->
    <!-- Left Wing -->
    <g transform="translate(-86, -16)">
      <rect x="0" y="0" width="62" height="32" rx="2" fill="url(#marsSolarPanel)" stroke="#0284c7" stroke-width="1.2"/>
      <line x1="20" y1="0" x2="20" y2="32" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="41" y1="0" x2="41" y2="32" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="62" y1="16" x2="68" y2="16" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- Right Wing -->
    <g transform="translate(24, -16)">
      <rect x="0" y="0" width="62" height="32" rx="2" fill="url(#marsSolarPanel)" stroke="#0284c7" stroke-width="1.2"/>
      <line x1="20" y1="0" x2="20" y2="32" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="41" y1="0" x2="41" y2="32" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="-6" y1="16" x2="0" y2="16" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- HiRISE Giant Telescopic Optical Barrel -->
    <g transform="translate(4, 18)">
      <rect x="-8" y="0" width="16" height="20" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
      <ellipse cx="0" cy="20" rx="8" ry="3" fill="#38bdf8"/>
    </g>

    <!-- Magnetometer & Radar Boom Antennas -->
    <line x1="-16" y1="16" x2="-32" y2="28" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="-32" cy="28" r="2" fill="#f97316"/>
  </g>

  <!-- HUD Telemetry Display -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">
    <text x="24" y="36" fill="#f97316" font-weight="bold">NASA // MARS ATMOSPHERIC &amp; CLIMATE SURVEY</text>
    <text x="24" y="54">ORBIT: LOW MARS SCIENCE ORBIT (300 km)</text>
    <text x="24" y="72">RADIO DELAY: 14.2 LIGHT-MINUTES // DSN KA-BAND</text>
  </g>
</svg>
