<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="deepSpace" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>
    <radialGradient id="lunarSurface" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="lunarSolar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#deepSpace)"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="90" cy="50" r="1.1"/>
    <circle cx="160" cy="130" r="0.7"/>
    <circle cx="280" cy="70" r="1.4"/>
    <circle cx="410" cy="40" r="0.8"/>
    <circle cx="560" cy="100" r="1.2"/>
    <circle cx="690" cy="55" r="0.9"/>
    <circle cx="750" cy="140" r="1.3"/>
    <circle cx="80" cy="400" r="1.0"/>
    <circle cx="670" cy="430" r="0.8"/>
  </g>

  <!-- Distant Blue Earth (Earthrise Perspective) -->
  <g transform="translate(640, 110)">
    <circle cx="0" cy="0" r="28" fill="#0369a1"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <path d="M -14 -12 Q -4 -16 6 -8 Q 14 -14 20 -4 Q 10 14 -6 16 Q -18 8 -14 -12 Z" fill="#16a34a" opacity="0.8"/>
    <path d="M -20 -6 Q 0 -10 16 0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Moon Surface Body (Lower Center) -->
  <g transform="translate(380, 560)">
    <circle cx="0" cy="0" r="330" fill="url(#lunarSurface)"/>
    <!-- Craters & Lunar Maria Basalt Plains -->
    <ellipse cx="-110" cy="-210" rx="65" ry="42" fill="#475569" opacity="0.7"/>
    <ellipse cx="60" cy="-240" rx="80" ry="50" fill="#475569" opacity="0.6"/>
    <ellipse cx="140" cy="-170" rx="55" ry="38" fill="#475569" opacity="0.65"/>
    <ellipse cx="-40" cy="-160" rx="40" ry="26" fill="#334155" opacity="0.55"/>

    <!-- Sharp Rim Craters with Ejecta Rays (Shackleton / Tycho style) -->
    <circle cx="-160" cy="-180" r="18" fill="#475569" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="10" cy="-270" r="24" fill="#334155" stroke="#f1f5f9" stroke-width="2.5"/>
    <!-- Permanently Shadowed Region (Cold Trap Blue Glow) -->
    <circle cx="10" cy="-270" r="16" fill="#0284c7" opacity="0.6"/>

    <circle cx="120" cy="-210" r="14" fill="#475569" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="-50" cy="-225" r="12" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Orbital Path Arc -->
  <path d="M 60,260 Q 380,180 720,290" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Neutron Spectrometer & Radar Sounding Cones -->
  <polygon points="360,205 270,305 450,305" fill="#38bdf8" opacity="0.12"/>
  <line x1="360" y1="205" x2="310" y2="305" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="360" y1="205" x2="410" y2="305" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Lunar Reconnaissance Probe (Center Top) -->
  <g transform="translate(360, 200) rotate(8)">
    <!-- Spacecraft Bus Core -->
    <rect x="-16" y="-16" width="32" height="32" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-12" y="-12" width="24" height="24" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- Solar Array Wing (Single large steerable paddle) -->
    <g transform="translate(16, -14)">
      <rect x="0" y="0" width="58" height="28" rx="2" fill="url(#lunarSolar)" stroke="#0284c7" stroke-width="1.2"/>
      <line x1="19" y1="0" x2="19" y2="28" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="38" y1="0" x2="38" y2="28" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
      <line x1="-6" y1="14" x2="0" y2="14" stroke="#94a3b8" stroke-width="3"/>
    </g>

    <!-- High-Gain Cassegrain Dish (Points to Earth at upper right) -->
    <g transform="translate(-16, -10) rotate(-45)">
      <path d="M -12 0 Q 0 -16 12 0" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="-12" r="1.5" fill="#38bdf8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="2.5"/>
    </g>

    <!-- Neutron Detector / Spectrometer Sensor Boom -->
    <line x1="0" y1="16" x2="0" y2="28" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="28" r="3" fill="#38bdf8"/>
  </g>

  <!-- HUD Text Overlay -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">
    <text x="24" y="36" fill="#38bdf8" font-weight="bold">NASA // LUNAR EXPLORATION MISSION</text>
    <text x="24" y="54">TARGET: LOW LUNAR POLAR ORBIT (LLO 100 km)</text>
    <text x="24" y="72">OBJECTIVE: POLAR WATER ICE &amp; GEODETIC MAPPING</text>
  </g>
</svg>
