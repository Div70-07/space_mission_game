<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="schematicBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="busFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pvCells" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Engineering Blueprint Canvas -->
  <rect width="800" height="500" fill="url(#schematicBg)"/>

  <!-- Technical Grid Background -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central Exploded Spacecraft Architecture -->
  <g transform="translate(400, 260)">
    <!-- Primary Structural Bus Frame -->
    <rect x="-45" y="-45" width="90" height="90" rx="4" fill="url(#busFoil)" stroke="#b45309" stroke-width="2"/>
    <!-- Internal Honeycomb Structure hint -->
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#92400e" stroke-dasharray="4 3" stroke-width="1"/>

    <!-- Left Solar Array Wing -->
    <g transform="translate(-165, -35)">
      <rect x="0" y="0" width="105" height="70" rx="3" fill="url(#pvCells)" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="35" y1="0" x2="35" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <line x1="70" y1="0" x2="70" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="35" x2="105" y2="35" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <!-- Structural Yoke / Gimbal Boom -->
      <line x1="105" y1="35" x2="120" y2="35" stroke="#94a3b8" stroke-width="4"/>
    </g>

    <!-- Right Solar Array Wing -->
    <g transform="translate(60, -35)">
      <rect x="0" y="0" width="105" height="70" rx="3" fill="url(#pvCells)" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="35" y1="0" x2="35" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <line x1="70" y1="0" x2="70" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="35" x2="105" y2="35" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
      <!-- Structural Yoke / Gimbal Boom -->
      <line x1="-15" y1="35" x2="0" y2="35" stroke="#94a3b8" stroke-width="4"/>
    </g>

    <!-- High Gain Antenna Subsystem (Top) -->
    <g transform="translate(0, -45)">
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#94a3b8" stroke-width="3"/>
      <!-- Reflector Dish -->
      <path d="M -35 -30 Q 0 -65 35 -30" fill="none" stroke="#f1f5f9" stroke-width="3.5"/>
      <!-- Subreflector Feed Horn -->
      <line x1="0" y1="-30" x2="0" y2="-52" stroke="#64748b" stroke-width="2"/>
      <circle cx="0" cy="-52" r="3" fill="#38bdf8"/>
    </g>

    <!-- Scientific Payload Suite (Bottom) -->
    <g transform="translate(0, 45)">
      <!-- Optical Telescope Barrel -->
      <rect x="-18" y="0" width="36" height="35" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <ellipse cx="0" cy="35" rx="18" ry="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <!-- Spectrometer Sensor Pod -->
      <rect x="-35" y="5" width="14" height="22" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <!-- Radar Sounding Dipole -->
      <line x1="25" y1="10" x2="55" y2="30" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="55" cy="30" r="2.5" fill="#f59e0b"/>
    </g>

    <!-- Reaction Control System (RCS Thruster Quads) -->
    <g fill="#475569">
      <circle cx="-42" cy="-42" r="3"/>
      <circle cx="42" cy="-42" r="3"/>
      <circle cx="-42" cy="42" r="3"/>
      <circle cx="42" cy="42" r="3"/>
    </g>
  </g>

  <!-- Technical Callout Leaders & Labels -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">
    <!-- Comms Callout -->
    <polyline points="400,165 480,110 650,110" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="400" cy="165" r="3" fill="#38bdf8"/>
    <text x="490" y="104" fill="#38bdf8" font-weight="bold">TELEMETRY &amp; COMMS SUBSYSTEM</text>
    <text x="490" y="124">High-Gain Cassegrain Dish (X/Ka-Band)</text>

    <!-- Power Callout -->
    <polyline points="280,260 210,180 50,180" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="280" cy="260" r="3" fill="#fbbf24"/>
    <text x="50" y="174" fill="#fbbf24" font-weight="bold">ELECTRICAL POWER SUBSYSTEM (EPS)</text>
    <text x="50" y="194">Dual UltraFlex Multi-Junction Solar Wings</text>

    <!-- Bus Callout -->
    <polyline points="380,270 320,380 90,380" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="380" cy="270" r="3" fill="#cbd5e1"/>
    <text x="90" y="374" fill="#cbd5e1" font-weight="bold">INTEGRATED CHASSIS &amp; AVIONICS</text>
    <text x="90" y="394">Carbon-Composite Bus, Flight Computer &amp; ADCS</text>

    <!-- Payload Callout -->
    <polyline points="420,320 500,420 680,420" fill="none" stroke="#2dd4bf" stroke-width="1.2"/>
    <circle cx="420" cy="320" r="3" fill="#2dd4bf"/>
    <text x="510" y="414" fill="#2dd4bf" font-weight="bold">SCIENTIFIC RESEARCH INSTRUMENTS</text>
    <text x="510" y="434">HiRISE Optical Imager &amp; Spectrometer Suite</text>
  </g>

  <!-- Title Header -->
  <g font-family="'Courier New', monospace">
    <text x="24" y="38" fill="#2dd4bf" font-size="14" font-weight="bold">SPACECRAFT SUBSYSTEM ARCHITECTURE SPECIFICATION</text>
    <text x="24" y="56" fill="#64748b" font-size="11">NASA SPACE MISSION DESIGN GAME // ENGINEERING REFERENCE</text>
  </g>
</svg>
