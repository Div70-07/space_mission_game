<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Deep Space Backdrop Disc -->
  <circle cx="16" cy="16" r="15" fill="#111827" stroke="#334155" stroke-width="1.5" />
  
  <!-- Outer Inclined Orbit Ring (Back Half) -->
  <ellipse
    cx="16"
    cy="16"
    rx="12"
    ry="4.5"
    transform="rotate(-28 16 16)"
    stroke="#3b82f6"
    stroke-width="1.5"
    stroke-dasharray="3 2"
    opacity="0.6"
  />

  <!-- Central Planet Body with Aerospace Blue Gradient -->
  <defs>
    <radialGradient id="fav-planet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="fav-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="6.5" fill="url(#fav-planet)" stroke="#60a5fa" stroke-width="0.75" />

  <!-- Outer Inclined Orbit Ring (Front Half) -->
  <path
    d="M 6.8 19.5 A 12 4.5 0 0 0 25.2 12.5"
    transform="rotate(-28 16 16)"
    stroke="url(#fav-ring)"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Orbiting Satellite Beacon -->
  <circle cx="24.5" cy="11.5" r="1.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.5" />
</svg>
